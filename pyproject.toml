[project]
name = "tc3-medtriage"
version = "0.1.0"
description = ""
authors = [
    {name = "efralmeida",email = "efralmeida@fazenda.sp.gov.br"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.116.1,<1.0.0)",
    "uvicorn[standard] (>=0.35.0,<1.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "joblib (>=1.5.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "pytest (>=8.4.0,<9.0.0)",
    "ruff (>=0.12.0,<1.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
