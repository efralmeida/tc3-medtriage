name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Validate lock file
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --with dev --sync --no-interaction
      - name: Lint
        run: poetry run ruff check src tests dags

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Validate lock file
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --with dev --sync --no-interaction
      - name: Tests
        run: poetry run pytest